name: ci-cd CI
'on':
  pull_request:
    branches:
    - main
permissions:
  contents: read
  packages: write
jobs:
  validate-validate:
    name: 'Validate: Infrastructure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Terraform Validate
      id: terraform-validate
      run: terraform validate
    - name: Terraform Plan
      id: terraform-plan
      run: terraform plan -out=tfplan
    - name: Helm Lint
      id: helm-lint
      run: helm lint .
